<!-- LOGIN OVERLAY -->
    <div id="login-overlay" class="fixed inset-0 z-[100] bg-gray-50 flex flex-col items-center justify-center transition-opacity duration-500 p-4">
        <div class="w-full max-w-sm bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[95vh]">
            <div class="bg-brand-dark p-6 text-center text-white relative transition-colors duration-300 shrink-0">
                <div class="w-16 h-16 md:w-20 md:h-20 mx-auto bg-white rounded-2xl flex items-center justify-center mb-3 shadow-lg p-1 relative z-10">
                    <div class="w-full h-full rounded-xl border-2 border-yellow-500 flex items-center justify-center bg-yellow-50 overflow-hidden">
                        <img id="login-logo-preview" src="" onerror="this.style.display='none'" class="object-cover w-full h-full p-2">
                    </div>
                </div>
                <h1 class="text-lg md:text-xl font-bold relative z-10" id="login-school-name">กำลังโหลดข้อมูล...</h1>
                <p class="text-xs md:text-sm text-white/80 mt-1 relative z-10">ปีการศึกษา <span id="login-year">-</span> ภาคเรียนที่ <span id="login-semester">-</span></p>
            </div>
            
            <div id="login-step-1" class="p-6 flex-1 flex flex-col justify-between animate-fade-in overflow-y-auto">
                <div class="mb-4">
                    <p class="text-center text-sm text-gray-500 mb-4 font-medium">กรอกรหัส PIN 6 หลักเพื่อเข้าสู่ระบบ</p>
                    <div class="flex justify-center gap-3 mb-6" id="pin-indicator">
                        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
                        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
                    </div>
                    <div class="grid grid-cols-3 gap-3 md:gap-4 max-w-[280px] w-full mx-auto px-2">
                        <button onclick="enterPin(1)" class="aspect-square rounded-2xl bg-gray-50 border border-gray-100 text-2xl md:text-3xl font-bold hover:bg-gray-200 transition-colors">1</button>
                        <button onclick="enterPin(2)" class="aspect-square rounded-2xl bg-gray-50 border border-gray-100 text-2xl md:text-3xl font-bold hover:bg-gray-200 transition-colors">2</button>
                        <button onclick="enterPin(3)" class="aspect-square rounded-2xl bg-gray-50 border border-gray-100 text-2xl md:text-3xl font-bold hover:bg-gray-200 transition-colors">3</button>
                        <button onclick="enterPin(4)" class="aspect-square rounded-2xl bg-gray-50 border border-gray-100 text-2xl md:text-3xl font-bold hover:bg-gray-200 transition-colors">4</button>
                        <button onclick="enterPin(5)" class="aspect-square rounded-2xl bg-gray-50 border border-gray-100 text-2xl md:text-3xl font-bold hover:bg-gray-200 transition-colors">5</button>
                        <button onclick="enterPin(6)" class="aspect-square rounded-2xl bg-gray-50 border border-gray-100 text-2xl md:text-3xl font-bold hover:bg-gray-200 transition-colors">6</button>
                        <button onclick="enterPin(7)" class="aspect-square rounded-2xl bg-gray-50 border border-gray-100 text-2xl md:text-3xl font-bold hover:bg-gray-200 transition-colors">7</button>
                        <button onclick="enterPin(8)" class="aspect-square rounded-2xl bg-gray-50 border border-gray-100 text-2xl md:text-3xl font-bold hover:bg-gray-200 transition-colors">8</button>
                        <button onclick="enterPin(9)" class="aspect-square rounded-2xl bg-gray-50 border border-gray-100 text-2xl md:text-3xl font-bold hover:bg-gray-200 transition-colors">9</button>
                        <button onclick="clearPin()" class="aspect-square rounded-2xl bg-red-50 text-red-500 hover:bg-red-100 text-xl md:text-2xl transition-colors"><i class="fa-solid fa-trash-can"></i></button>
                        <button onclick="enterPin(0)" class="aspect-square rounded-2xl bg-gray-50 border border-gray-100 text-2xl md:text-3xl font-bold hover:bg-gray-200 transition-colors">0</button>
                        <button onclick="deletePin()" class="aspect-square rounded-2xl bg-gray-100 text-gray-600 hover:bg-gray-200 text-2xl md:text-3xl transition-colors"><i class="fa-solid fa-delete-left"></i></button>
                    </div>
                </div>
                
                <!-- Login Footer (ย้ายลงมาต่อท้ายกล่องและกันการทับ) -->
                <div class="w-full text-center mt-auto pt-2 shrink-0">
                    <p class="text-[9px] font-semibold text-gray-400 tracking-wider mb-1 whitespace-nowrap">- INNOVATE &bull; EDUCATE &bull; DIGITAL TECHNOLOGY &bull; TEACHER -</p>
                    <p class="text-[8px] text-gray-400/70">&copy; 2026 BANSUBKANLUENG SCHOOL</p>
                </div>
            </div>
            
            <div id="login-step-2" class="p-6 flex-1 flex flex-col justify-start hidden animate-fade-in">
                <h2 class="text-center text-lg font-bold text-gray-800 mb-2">เลือกผู้บันทึกข้อมูล</h2>
                <p class="text-center text-sm text-gray-500 mb-6">กรุณาระบุตัวตนของท่านสำหรับการบันทึกข้อมูล</p>
                <div class="flex-1 overflow-y-auto max-h-[300px] pr-2 space-y-3" id="teacher-selection-list"></div>
                <button onclick="logout()" class="mt-6 w-full text-gray-500 hover:text-red-500 font-medium transition-colors text-sm"><i class="fa-solid fa-arrow-left mr-1"></i> ย้อนกลับ (ใส่รหัสใหม่)</button>
            </div>
        </div>
    </div>
